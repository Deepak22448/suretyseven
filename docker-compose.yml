services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suretyseven
      POSTGRES_PASSWORD: suretyseven
      POSTGRES_DB: documents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suretyseven"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://suretyseven:suretyseven@postgres:5432/documents
      PORT: 4000
      STORAGE_DIR: /repo/backend/storage
    ports:
      - "4000:4000"
    volumes:
      - storage:/repo/backend/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
